# Paper-trading bot config. Edit freely; every run reads this file.

tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AMD, AVGO, JPM, V, NFLX, COST, PLTR, UBER]
benchmark: SPY

# ---- Entry rule: "dip" or "rsi" ----
entry_rule: dip
timeframe_min: 5          # bar size in minutes (1, 5, 15). yfinance fallback: 1m = last 7 days only
dip_pct: 1.0              # dip: enter when close is >= this % below intraday VWAP
rsi_period: 14
rsi_threshold: 25         # rsi: enter when RSI < this

# ---- Exits (bracket orders, server-side in live paper) ----
take_profit_pct: 1.5
stop_loss_pct: 1.0

# ---- Risk ----
starting_cash: 100000     # backtest only; live uses your Alpaca paper balance
position_size_pct: 10     # % of equity per position
max_open_positions: 5
max_daily_loss_pct: 2.0   # stop new entries + flatten if equity drops this much intraday
one_entry_per_ticker_per_day: true

# ---- Session ----
no_entry_first_min: 15    # no entries in first N minutes after 9:30 ET
no_entry_last_min: 30     # no new entries in last N minutes before 16:00 ET
flatten_at_close: true
flatten_min_before_close: 5
stale_order_min: 5        # cancel unfilled entry orders after N minutes (live)

# ---- Backtest assumptions ----
backtest_days: 59         # yfinance caps 5m data at 60 days; with Alpaca keys you can use 180-365
slippage_bps: 3           # per side
commission_per_share: 0.0 # Alpaca is commission-free; set e.g. 0.005 to be conservative

db_path: trader.db

# =====================================================================
# SWING mode (daily bars): fundamentals filter + long-term & short-term sleeves
#   python main.py swing          -> backtest this config
#   python main.py swing-compare  -> compare variants vs SPY and the 1%/month target
#   python main.py swing-live     -> Alpaca paper, runs once per trading day after the open
# =====================================================================
swing:
  start: "2016-01-01"
  starting_cash: 100000
  slippage_bps: 5
  monthly_target_pct: 1.0       # your goal: 1%/month (~12.7%/yr compounded)

  universe: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, ORCL, ADBE, CRM, AMD, QCOM, TXN, INTU, NOW,
             JPM, V, MA, BAC, GS, AXP, UNH, LLY, JNJ, ABBV, MRK, TMO, ISRG,
             COST, WMT, HD, MCD, PG, KO, PEP, NKE, TJX, CAT, DE, HON, GE, UNP, LMT,
             XOM, CVX, NFLX, TMUS, UBER, PLTR, TSLA]

  # Fundamentals screen (current snapshot from Yahoo): profitable, FCF positive, then ranked on
  # ROE, profit margin, revenue growth, low debt/equity, reasonable forward P/E. Keep the top N.
  fundamental_filter: true
  top_n_quality: 20

  long_term:                    # "buy quality, hold while it trends up"
    allocation_pct: 60
    max_positions: 6
    entry: close > 200-day MA and 50-day MA > 200-day MA, ranked by 12-month momentum
    rebalance: monthly          # trend check + fill open slots on month end
    take_profit_pct: null       # null = let winners run
    stop_loss_pct: null
    trailing_stop_pct: 15       # sell if it falls 15% from its high since entry (server-side in live)

  short_term:                   # "buy the dip in a quality uptrend, +10% / -5%"
    allocation_pct: 40
    max_positions: 4
    rsi_period: 2
    rsi_threshold: 10           # buy when 2-day RSI < 10 while price is above its 200-day MA
    take_profit_pct: 10
    stop_loss_pct: 5
    trailing_stop_pct: null
    max_hold_days: 40           # time stop: exit if neither level hit after N trading days (null = never)

  # ---- Trading costs (applied to every backtest AND the forward test) ----
  # Fees change, so check your broker's current fee page and edit the numbers.
  costs:
    preset: au_flat_fee         # which preset below to use
    presets:
      us_zero_commission:       # Alpaca-style US broker: $0 commission, regulatory fees on sells only
        sec_fee_per_million: 27.80    # SEC Section 31 fee on sell value (rate is reset yearly; conservative)
        finra_taf_per_share: 0.000166 # FINRA trading activity fee on shares sold
        finra_taf_max: 8.30
      per_share:                # IBKR-style tiered: $0.005/share, $1 min, capped at 1% of trade value
        commission_per_share: 0.005
        min_commission: 1.0
        max_commission_pct: 1.0
        sec_fee_per_million: 27.80
        finra_taf_per_share: 0.000166
        finra_taf_max: 8.30
      au_flat_fee:              # Typical Australian app buying US shares: flat fee per order + AUD->USD FX
        commission_per_order: 3.00
        fx_fee_pct: 0.70        # FX margin on converting AUD to USD
        fx_mode: once           # once = convert on deposit and hold USD; per_trade = pay FX on every trade
        sec_fee_per_million: 27.80
        finra_taf_per_share: 0.000166
        finra_taf_max: 8.30

# ---- Claude's algo: SAME stocks and SAME buy rules, different exits (fixed up front, not tuned) ----
claude_exits:
  long_term:
    trailing_stop_pct: null
    atr_trail_mult: 3.0         # chandelier stop: highest high since entry - 3 x ATR(22)
    atr_period: 22
  short_term:
    take_profit_pct: null       # no fixed target...
    exit_above_sma: 5           # ...sell when the bounce is done (close back above the 5-day average)
    stop_loss_pct: null
    atr_stop_mult: 2.5          # stop = entry - 2.5 x ATR(14), scales with each stock's volatility
    atr_period: 14
    max_hold_days: 10
